<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 518" width="400" height="518" role="img" font-family="-apple-system, system-ui, Segoe UI, Roboto, Helvetica, Arial, sans-serif"><title>How to choose a model</title><rect width="400" height="518" rx="20" fill="#F3F5F8"/><text x="24" y="50" font-size="26" font-weight="700" fill="#0E1B3D">How to choose a model</text><rect x="20" y="74" width="360" height="98" rx="12" fill="#fff" stroke="#DCE1E9" stroke-width="2"/><rect x="20" y="74" width="7" height="98" rx="3" fill="#1F8A4C"/><text x="42" y="102" font-size="18" fill="#5E6883">Time for suppliers</text><text x="42" y="126" font-size="18" fill="#5E6883">and you meet the MOQ?</text><text x="42" y="156" font-size="21" font-weight="700" fill="#0E1B3D">→ buy direct</text><rect x="20" y="184" width="360" height="74" rx="12" fill="#fff" stroke="#DCE1E9" stroke-width="2"/><rect x="20" y="184" width="7" height="74" rx="3" fill="#E08A00"/><text x="42" y="212" font-size="18" fill="#5E6883">Order below the factory MOQ?</text><text x="42" y="242" font-size="21" font-weight="700" fill="#0E1B3D">→ trading company</text><rect x="20" y="270" width="360" height="74" rx="12" fill="#fff" stroke="#DCE1E9" stroke-width="2"/><rect x="20" y="270" width="7" height="74" rx="3" fill="#2F6BE8"/><text x="42" y="298" font-size="18" fill="#5E6883">Large orders ahead?</text><text x="42" y="328" font-size="21" font-weight="700" fill="#0E1B3D">→ service agent</text><rect x="20" y="356" width="360" height="98" rx="12" fill="#fff" stroke="#DCE1E9" stroke-width="2"/><rect x="20" y="356" width="7" height="98" rx="3" fill="#0E1B3D"/><text x="42" y="384" font-size="18" fill="#5E6883">Also need warehouse,</text><text x="42" y="408" font-size="18" fill="#5E6883">packing and shipping?</text><text x="42" y="438" font-size="21" font-weight="700" fill="#0E1B3D">→ full-cycle agent</text><text x="24" y="484" font-size="15" fill="#5E6883">Rows 1-3 based on Global Sources (2023),</text><text x="24" y="506" font-size="15" fill="#5E6883">row 4 is our conclusion</text></svg>
