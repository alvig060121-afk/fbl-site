<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 670" width="400" height="670" role="img" font-family="-apple-system, system-ui, Segoe UI, Roboto, Helvetica, Arial, sans-serif"><title>Кто кому платит</title><rect width="400" height="670" rx="20" fill="#F3F5F8"/><text x="24" y="50" font-size="26" font-weight="700" fill="#0E1B3D">Кто кому платит</text><rect x="14" y="74" width="372" height="168" rx="14" fill="#fff"/><text x="30" y="108" font-size="21" font-weight="700" fill="#0E1B3D">Агент на комиссии</text><circle cx="35" cy="134" r="5" fill="#2F6BE8"/><text x="48" y="140" font-size="18" font-weight="700" fill="#0E1B3D">Вы → агент</text><text x="48" y="164" font-size="18" fill="#5E6883">процент от закупки</text><circle cx="35" cy="192" r="5" fill="#B8322F"/><text x="48" y="198" font-size="18" font-weight="700" fill="#0E1B3D">Фабрика → агент</text><text x="48" y="222" font-size="18" fill="#B8322F">скрытая комиссия (бывает)</text><rect x="14" y="254" width="372" height="168" rx="14" fill="#fff"/><text x="30" y="288" font-size="21" font-weight="700" fill="#0E1B3D">Торговая компания</text><circle cx="35" cy="314" r="5" fill="#2F6BE8"/><text x="48" y="320" font-size="18" font-weight="700" fill="#0E1B3D">Вы → компания</text><text x="48" y="344" font-size="18" fill="#5E6883">цена товара с наценкой</text><circle cx="35" cy="372" r="5" fill="#2F6BE8"/><text x="48" y="378" font-size="18" font-weight="700" fill="#0E1B3D">Компания → фабрика</text><text x="48" y="402" font-size="18" fill="#5E6883">закупка на своё имя</text><rect x="14" y="434" width="372" height="168" rx="14" fill="#fff"/><text x="30" y="468" font-size="21" font-weight="700" fill="#0E1B3D">Сервисный агент</text><circle cx="35" cy="494" r="5" fill="#2F6BE8"/><text x="48" y="500" font-size="18" font-weight="700" fill="#0E1B3D">Вы → агент</text><text x="48" y="524" font-size="18" fill="#5E6883">открытая плата за услугу</text><circle cx="35" cy="552" r="5" fill="#2F6BE8"/><text x="48" y="558" font-size="18" font-weight="700" fill="#0E1B3D">Фабрика</text><text x="48" y="582" font-size="18" fill="#5E6883">название и процесс вам известны</text><text x="24" y="636" font-size="15" fill="#5E6883">По материалам Global Sources (2023)</text><text x="24" y="658" font-size="15" fill="#5E6883">и QualityInspection.org</text></svg>
