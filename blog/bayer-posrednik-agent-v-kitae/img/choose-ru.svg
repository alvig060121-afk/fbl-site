<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 566" width="400" height="566" role="img" font-family="-apple-system, system-ui, Segoe UI, Roboto, Helvetica, Arial, sans-serif"><title>Как выбрать модель</title><rect width="400" height="566" rx="20" fill="#F3F5F8"/><text x="24" y="50" font-size="26" font-weight="700" fill="#0E1B3D">Как выбрать модель</text><rect x="20" y="74" width="360" height="98" rx="12" fill="#fff" stroke="#DCE1E9" stroke-width="2"/><rect x="20" y="74" width="7" height="98" rx="3" fill="#1F8A4C"/><text x="42" y="102" font-size="18" fill="#5E6883">Есть время на поставщиков</text><text x="42" y="126" font-size="18" fill="#5E6883">и выходите на минимальный заказ?</text><text x="42" y="156" font-size="21" font-weight="700" fill="#0E1B3D">→ закупать напрямую</text><rect x="20" y="184" width="360" height="98" rx="12" fill="#fff" stroke="#DCE1E9" stroke-width="2"/><rect x="20" y="184" width="7" height="98" rx="3" fill="#E08A00"/><text x="42" y="212" font-size="18" fill="#5E6883">Партия меньше</text><text x="42" y="236" font-size="18" fill="#5E6883">минимального заказа?</text><text x="42" y="266" font-size="21" font-weight="700" fill="#0E1B3D">→ торговая компания</text><rect x="20" y="294" width="360" height="98" rx="12" fill="#fff" stroke="#DCE1E9" stroke-width="2"/><rect x="20" y="294" width="7" height="98" rx="3" fill="#2F6BE8"/><text x="42" y="322" font-size="18" fill="#5E6883">Впереди</text><text x="42" y="346" font-size="18" fill="#5E6883">крупные заказы?</text><text x="42" y="376" font-size="21" font-weight="700" fill="#0E1B3D">→ сервисный агент</text><rect x="20" y="404" width="360" height="98" rx="12" fill="#fff" stroke="#DCE1E9" stroke-width="2"/><rect x="20" y="404" width="7" height="98" rx="3" fill="#0E1B3D"/><text x="42" y="432" font-size="18" fill="#5E6883">Нужны ещё склад,</text><text x="42" y="456" font-size="18" fill="#5E6883">упаковка и доставка?</text><text x="42" y="486" font-size="21" font-weight="700" fill="#0E1B3D">→ агент полного цикла</text><text x="24" y="532" font-size="15" fill="#5E6883">Первые три - по Global Sources (2023),</text><text x="24" y="554" font-size="15" fill="#5E6883">четвёртое - наш вывод</text></svg>
