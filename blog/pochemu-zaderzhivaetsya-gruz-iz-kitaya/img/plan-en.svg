<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 704" width="560" height="704" role="img" font-family="-apple-system, system-ui, Segoe UI, Roboto, Helvetica, Arial, sans-serif"><title>Plan for Lunar New Year 2027</title><rect width="560" height="704" rx="20" fill="#F3F5F8"/><text x="32" y="58" font-size="31" font-weight="700" fill="#0E1B3D">Plan for Lunar New Year 2027</text><text x="32" y="94" font-size="23" fill="#5E6883">FBL Group guideline, shipping before the holiday</text><rect x="32" y="130" width="8" height="80" rx="4" fill="#2F6BE8"/><text x="58" y="160" font-size="27" font-weight="700" fill="#2F6BE8">November 2026</text><text x="58" y="196" font-size="25" fill="#0E1B3D">choose a factory, approve the sample</text><rect x="32" y="236" width="8" height="80" rx="4" fill="#2F6BE8"/><text x="58" y="266" font-size="27" font-weight="700" fill="#2F6BE8">By mid-December</text><text x="58" y="302" font-size="25" fill="#0E1B3D">start production</text><rect x="32" y="342" width="8" height="80" rx="4" fill="#2F6BE8"/><text x="58" y="372" font-size="27" font-weight="700" fill="#2F6BE8">First half of January</text><text x="58" y="408" font-size="25" fill="#0E1B3D">inspect the goods and ship</text><rect x="32" y="448" width="8" height="80" rx="4" fill="#B8322F"/><text x="58" y="478" font-size="27" font-weight="700" fill="#B8322F">6 February 2027</text><text x="58" y="514" font-size="25" fill="#0E1B3D">Lunar New Year</text><rect x="32" y="554" width="8" height="80" rx="4" fill="#2F6BE8"/><text x="58" y="584" font-size="27" font-weight="700" fill="#2F6BE8">February – early March</text><text x="58" y="620" font-size="25" fill="#0E1B3D">factories and carriers restart</text><text x="32" y="674" font-size="21" fill="#5E6883">Holiday date: GovHK, 2027</text></svg>
