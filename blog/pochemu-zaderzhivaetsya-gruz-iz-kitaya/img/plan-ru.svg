<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 704" width="560" height="704" role="img" font-family="-apple-system, system-ui, Segoe UI, Roboto, Helvetica, Arial, sans-serif"><title>План к Китайскому Новому году</title><rect width="560" height="704" rx="20" fill="#F3F5F8"/><text x="32" y="58" font-size="31" font-weight="700" fill="#0E1B3D">План к Китайскому Новому году</text><text x="32" y="94" font-size="23" fill="#5E6883">ориентир FBL Group, отгрузка до праздников</text><rect x="32" y="130" width="8" height="80" rx="4" fill="#2F6BE8"/><text x="58" y="160" font-size="27" font-weight="700" fill="#2F6BE8">Ноябрь 2026</text><text x="58" y="196" font-size="25" fill="#0E1B3D">выбрать фабрику, утвердить образец</text><rect x="32" y="236" width="8" height="80" rx="4" fill="#2F6BE8"/><text x="58" y="266" font-size="27" font-weight="700" fill="#2F6BE8">До середины декабря</text><text x="58" y="302" font-size="25" fill="#0E1B3D">запустить производство</text><rect x="32" y="342" width="8" height="80" rx="4" fill="#2F6BE8"/><text x="58" y="372" font-size="27" font-weight="700" fill="#2F6BE8">1-я половина января</text><text x="58" y="408" font-size="25" fill="#0E1B3D">проверка партии и отгрузка</text><rect x="32" y="448" width="8" height="80" rx="4" fill="#B8322F"/><text x="58" y="478" font-size="27" font-weight="700" fill="#B8322F">6 февраля 2027</text><text x="58" y="514" font-size="25" fill="#0E1B3D">Китайский Новый год</text><rect x="32" y="554" width="8" height="80" rx="4" fill="#2F6BE8"/><text x="58" y="584" font-size="27" font-weight="700" fill="#2F6BE8">Февраль – начало марта</text><text x="58" y="620" font-size="25" fill="#0E1B3D">фабрики и перевозчики оживают</text><text x="32" y="674" font-size="21" fill="#5E6883">Дата праздника: GovHK, 2027</text></svg>
