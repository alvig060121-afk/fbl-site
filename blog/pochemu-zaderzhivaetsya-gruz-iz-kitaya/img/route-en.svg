<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 752" width="560" height="752" role="img" font-family="-apple-system, system-ui, Segoe UI, Roboto, Helvetica, Arial, sans-serif"><title>Where shipments lose time</title><rect width="560" height="752" rx="20" fill="#F3F5F8"/><text x="32" y="62" font-size="31" font-weight="700" fill="#0E1B3D">Where shipments lose time</text><line x1="58" y1="138" x2="58" y2="238" stroke="#DCE1E9" stroke-width="4"/><circle cx="58" cy="138" r="26" fill="#2F6BE8"/><text x="58" y="148" font-size="27" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="100" y="134" font-size="28" font-weight="700" fill="#0E1B3D">Factory</text><text x="100" y="170" font-size="25" fill="#5E6883">goods not ready, holidays, no sample</text><line x1="58" y1="264" x2="58" y2="364" stroke="#DCE1E9" stroke-width="4"/><circle cx="58" cy="264" r="26" fill="#2F6BE8"/><text x="58" y="274" font-size="27" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="100" y="260" font-size="28" font-weight="700" fill="#0E1B3D">Documents</text><text x="100" y="296" font-size="25" fill="#5E6883">invoice and packing list differ</text><line x1="58" y1="390" x2="58" y2="490" stroke="#DCE1E9" stroke-width="4"/><circle cx="58" cy="390" r="26" fill="#2F6BE8"/><text x="58" y="400" font-size="27" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="100" y="386" font-size="28" font-weight="700" fill="#0E1B3D">Border and customs</text><text x="100" y="422" font-size="25" fill="#5E6883">queues, inspections, checks</text><line x1="58" y1="516" x2="58" y2="616" stroke="#DCE1E9" stroke-width="4"/><circle cx="58" cy="516" r="26" fill="#2F6BE8"/><text x="58" y="526" font-size="27" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="100" y="512" font-size="28" font-weight="700" fill="#0E1B3D">Route</text><text x="100" y="548" font-size="25" fill="#5E6883">Suez diversion, choice of sailing</text><circle cx="58" cy="642" r="26" fill="#2F6BE8"/><text x="58" y="652" font-size="27" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="100" y="638" font-size="28" font-weight="700" fill="#0E1B3D">Delivery format</text><text x="100" y="674" font-size="25" fill="#5E6883">cargo or full paperwork, buffer</text></svg>
