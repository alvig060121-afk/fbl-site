<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 586" width="400" height="586" role="img" font-family="-apple-system, system-ui, Segoe UI, Roboto, Helvetica, Arial, sans-serif"><title>ODM или OEM</title><rect width="400" height="586" rx="20" fill="#F3F5F8"/><text x="24" y="50" font-size="26" font-weight="700" fill="#0E1B3D">ODM или OEM</text><rect x="14" y="74" width="372" height="218" rx="14" fill="#fff"/><rect x="14" y="74" width="7" height="218" rx="3" fill="#2F6BE8"/><text x="34" y="110" font-size="22" font-weight="700" fill="#0E1B3D">ODM: товар фабрики</text><text x="34" y="140" font-size="15" fill="#5E6883">Что меняете</text><text x="34" y="162" font-size="18" font-weight="700" fill="#0E1B3D">логотип, цвет, материал, упаковку</text><text x="34" y="194" font-size="15" fill="#5E6883">Чей дизайн</text><text x="34" y="216" font-size="18" font-weight="700" fill="#0E1B3D">фабрики, бывает у конкурентов</text><text x="34" y="248" font-size="15" fill="#5E6883">Вложения и срок</text><text x="34" y="270" font-size="18" font-weight="700" fill="#0E1B3D">меньше и быстрее</text><rect x="14" y="304" width="372" height="218" rx="14" fill="#fff"/><rect x="14" y="304" width="7" height="218" rx="3" fill="#0E1B3D"/><text x="34" y="340" font-size="22" font-weight="700" fill="#0E1B3D">OEM: ваш продукт</text><text x="34" y="370" font-size="15" fill="#5E6883">Что меняете</text><text x="34" y="392" font-size="18" font-weight="700" fill="#0E1B3D">конструкцию или весь продукт</text><text x="34" y="424" font-size="15" fill="#5E6883">Чей дизайн</text><text x="34" y="446" font-size="18" font-weight="700" fill="#0E1B3D">ваш</text><text x="34" y="478" font-size="15" fill="#5E6883">Вложения и срок</text><text x="34" y="500" font-size="18" font-weight="700" fill="#0E1B3D">больше: образцы, формы</text><text x="24" y="552" font-size="15" fill="#5E6883">По материалам Guided Imports</text><text x="24" y="574" font-size="15" fill="#5E6883">и JingSourcing</text></svg>
