<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 584" width="400" height="584" role="img" font-family="-apple-system, system-ui, Segoe UI, Roboto, Helvetica, Arial, sans-serif"><title>От задачи до партии</title><rect width="400" height="584" rx="20" fill="#F3F5F8"/><text x="24" y="50" font-size="26" font-weight="700" fill="#0E1B3D">От задачи до партии</text><line x1="40" y1="114" x2="40" y2="162" stroke="#DCE1E9" stroke-width="3"/><circle cx="40" cy="100" r="14" fill="#0E1B3D"/><text x="40" y="105" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="66" y="102" font-size="19" font-weight="700" fill="#0E1B3D">Задача</text><text x="66" y="124" font-size="15" fill="#5E6883">образец, фото, ТЗ или идея</text><line x1="40" y1="178" x2="40" y2="226" stroke="#DCE1E9" stroke-width="3"/><circle cx="40" cy="164" r="14" fill="#B8322F"/><text x="40" y="169" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="66" y="166" font-size="19" font-weight="700" fill="#0E1B3D">Товарный знак</text><text x="66" y="188" font-size="15" fill="#B8322F">заявка в Китае до запуска</text><line x1="40" y1="242" x2="40" y2="290" stroke="#DCE1E9" stroke-width="3"/><circle cx="40" cy="228" r="14" fill="#B8322F"/><text x="40" y="233" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="66" y="230" font-size="19" font-weight="700" fill="#0E1B3D">Фабрика и NNN</text><text x="66" y="252" font-size="15" fill="#B8322F">NNN до передачи чертежей</text><line x1="40" y1="306" x2="40" y2="354" stroke="#DCE1E9" stroke-width="3"/><circle cx="40" cy="292" r="14" fill="#1F8A4C"/><text x="40" y="297" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="66" y="294" font-size="19" font-weight="700" fill="#0E1B3D">Образцы</text><text x="66" y="316" font-size="15" fill="#1F8A4C">правки, утверждение эталона</text><line x1="40" y1="370" x2="40" y2="418" stroke="#DCE1E9" stroke-width="3"/><circle cx="40" cy="356" r="14" fill="#0E1B3D"/><text x="40" y="361" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="66" y="358" font-size="19" font-weight="700" fill="#0E1B3D">Производство</text><text x="66" y="380" font-size="15" fill="#5E6883">по согласованным характеристикам</text><line x1="40" y1="434" x2="40" y2="482" stroke="#DCE1E9" stroke-width="3"/><circle cx="40" cy="420" r="14" fill="#1F8A4C"/><text x="40" y="425" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">6</text><text x="66" y="422" font-size="19" font-weight="700" fill="#0E1B3D">Проверка</text><text x="66" y="444" font-size="15" fill="#1F8A4C">сравнение партии с эталоном</text><circle cx="40" cy="484" r="14" fill="#0E1B3D"/><text x="40" y="489" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">7</text><text x="66" y="486" font-size="19" font-weight="700" fill="#0E1B3D">Отправка</text><text x="66" y="508" font-size="15" fill="#5E6883">упаковка, маркировка, доставка</text><text x="24" y="550" font-size="15" fill="#5E6883">Шаги - FBL Group; защита бренда -</text><text x="24" y="572" font-size="15" fill="#5E6883">по Harris Sliwoski и IPWatchdog</text></svg>
