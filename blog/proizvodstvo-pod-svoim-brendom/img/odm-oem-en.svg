<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 586" width="400" height="586" role="img" font-family="-apple-system, system-ui, Segoe UI, Roboto, Helvetica, Arial, sans-serif"><title>ODM or OEM</title><rect width="400" height="586" rx="20" fill="#F3F5F8"/><text x="24" y="50" font-size="26" font-weight="700" fill="#0E1B3D">ODM or OEM</text><rect x="14" y="74" width="372" height="218" rx="14" fill="#fff"/><rect x="14" y="74" width="7" height="218" rx="3" fill="#2F6BE8"/><text x="34" y="110" font-size="22" font-weight="700" fill="#0E1B3D">ODM: factory product</text><text x="34" y="140" font-size="15" fill="#5E6883">What you change</text><text x="34" y="162" font-size="18" font-weight="700" fill="#0E1B3D">logo, colour, material, packaging</text><text x="34" y="194" font-size="15" fill="#5E6883">Whose design</text><text x="34" y="216" font-size="18" font-weight="700" fill="#0E1B3D">factory's, rivals may have it</text><text x="34" y="248" font-size="15" fill="#5E6883">Investment and time</text><text x="34" y="270" font-size="18" font-weight="700" fill="#0E1B3D">lower and faster</text><rect x="14" y="304" width="372" height="218" rx="14" fill="#fff"/><rect x="14" y="304" width="7" height="218" rx="3" fill="#0E1B3D"/><text x="34" y="340" font-size="22" font-weight="700" fill="#0E1B3D">OEM: your product</text><text x="34" y="370" font-size="15" fill="#5E6883">What you change</text><text x="34" y="392" font-size="18" font-weight="700" fill="#0E1B3D">the design or the whole product</text><text x="34" y="424" font-size="15" fill="#5E6883">Whose design</text><text x="34" y="446" font-size="18" font-weight="700" fill="#0E1B3D">yours</text><text x="34" y="478" font-size="15" fill="#5E6883">Investment and time</text><text x="34" y="500" font-size="18" font-weight="700" fill="#0E1B3D">higher: samples, moulds</text><text x="24" y="552" font-size="15" fill="#5E6883">Based on Guided Imports</text><text x="24" y="574" font-size="15" fill="#5E6883">and JingSourcing</text></svg>
