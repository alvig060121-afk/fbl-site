<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 578" width="400" height="578" role="img" font-family="-apple-system, system-ui, Segoe UI, Roboto, Helvetica, Arial, sans-serif"><title>Платный вес в авиа</title><rect width="400" height="578" rx="20" fill="#F3F5F8"/><text x="24" y="50" font-size="26" font-weight="700" fill="#0E1B3D">Платный вес в авиа</text><rect x="14" y="74" width="372" height="214" rx="14" fill="#fff"/><text x="30" y="106" font-size="20" font-weight="700" fill="#0E1B3D">Партия 1: текстиль</text><text x="30" y="130" font-size="16" fill="#5E6883">10 коробок 60×40×40 см по 8 кг</text><text x="30" y="168" font-size="16" fill="#0E1B3D">Фактический вес</text><rect x="30" y="176" width="125" height="18" rx="5" fill="#5E6883" opacity="0.35"/><text x="163" y="191" font-size="16" font-weight="700" fill="#0E1B3D">80 кг</text><text x="30" y="218" font-size="16" fill="#0E1B3D">Объёмный вес (Д×Ш×В / 6000)</text><rect x="30" y="226" width="250" height="18" rx="5" fill="#2F6BE8" opacity="1"/><text x="288" y="241" font-size="16" font-weight="700" fill="#0E1B3D">160 кг</text><text x="30" y="270" font-size="19" font-weight="700" fill="#1F8A4C">Платите за: 160 кг</text><rect x="14" y="300" width="372" height="214" rx="14" fill="#fff"/><text x="30" y="332" font-size="20" font-weight="700" fill="#0E1B3D">Партия 2: металл</text><text x="30" y="356" font-size="16" fill="#5E6883">5 коробок 40×30×30 см по 20 кг</text><text x="30" y="394" font-size="16" fill="#0E1B3D">Фактический вес</text><rect x="30" y="402" width="156" height="18" rx="5" fill="#5E6883" opacity="1"/><text x="194" y="417" font-size="16" font-weight="700" fill="#0E1B3D">100 кг</text><text x="30" y="444" font-size="16" fill="#0E1B3D">Объёмный вес (Д×Ш×В / 6000)</text><rect x="30" y="452" width="47" height="18" rx="5" fill="#2F6BE8" opacity="0.35"/><text x="85" y="467" font-size="16" font-weight="700" fill="#0E1B3D">30 кг</text><text x="30" y="496" font-size="19" font-weight="700" fill="#1F8A4C">Платите за: 100 кг</text><text x="24" y="544" font-size="15" fill="#5E6883">Делитель 6000 - стандарт IATA (по Maersk).</text><text x="24" y="566" font-size="15" fill="#5E6883">Расчёт наш, коробки условные</text></svg>
