<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 542" width="400" height="542" role="img" font-family="-apple-system, system-ui, Segoe UI, Roboto, Helvetica, Arial, sans-serif"><title>Как сузить выбор</title><rect width="400" height="542" rx="20" fill="#F3F5F8"/><text x="24" y="50" font-size="26" font-weight="700" fill="#0E1B3D">Как сузить выбор</text><rect x="20" y="74" width="360" height="98" rx="12" fill="#fff" stroke="#DCE1E9" stroke-width="2"/><rect x="20" y="74" width="7" height="98" rx="3" fill="#2F6BE8"/><text x="42" y="102" font-size="18" fill="#5E6883">Нужно срочно или это</text><text x="42" y="126" font-size="18" fill="#5E6883">образцы на несколько кг?</text><text x="42" y="156" font-size="20" font-weight="700" fill="#0E1B3D">→ авиа</text><rect x="20" y="184" width="360" height="74" rx="12" fill="#fff" stroke="#DCE1E9" stroke-width="2"/><rect x="20" y="184" width="7" height="74" rx="3" fill="#1F8A4C"/><text x="42" y="212" font-size="18" fill="#5E6883">Груз лёгкий, но объёмный?</text><text x="42" y="242" font-size="20" font-weight="700" fill="#0E1B3D">→ сравнить авто, ж/д и море</text><rect x="20" y="270" width="360" height="98" rx="12" fill="#fff" stroke="#DCE1E9" stroke-width="2"/><rect x="20" y="270" width="7" height="98" rx="3" fill="#0E1B3D"/><text x="42" y="298" font-size="18" fill="#5E6883">Большой объём,</text><text x="42" y="322" font-size="18" fill="#5E6883">срок не горит?</text><text x="42" y="352" font-size="20" font-weight="700" fill="#0E1B3D">→ море или ж/д</text><rect x="20" y="380" width="360" height="98" rx="12" fill="#fff" stroke="#DCE1E9" stroke-width="2"/><rect x="20" y="380" width="7" height="98" rx="3" fill="#B8322F"/><text x="42" y="408" font-size="18" fill="#5E6883">В товаре есть</text><text x="42" y="432" font-size="18" fill="#5E6883">литиевые батареи?</text><text x="42" y="462" font-size="20" font-weight="700" fill="#0E1B3D">→ сначала правила перевозки</text><text x="24" y="508" font-size="15" fill="#5E6883">Наш вывод: платный вес (Maersk, DHL),</text><text x="24" y="530" font-size="15" fill="#5E6883">стоимость (Forto), батареи (IATA)</text></svg>
