<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 578" width="400" height="578" role="img" font-family="-apple-system, system-ui, Segoe UI, Roboto, Helvetica, Arial, sans-serif"><title>Air chargeable weight</title><rect width="400" height="578" rx="20" fill="#F3F5F8"/><text x="24" y="50" font-size="26" font-weight="700" fill="#0E1B3D">Air chargeable weight</text><rect x="14" y="74" width="372" height="214" rx="14" fill="#fff"/><text x="30" y="106" font-size="20" font-weight="700" fill="#0E1B3D">Shipment 1: textiles</text><text x="30" y="130" font-size="16" fill="#5E6883">10 cartons 60×40×40 cm, 8 kg each</text><text x="30" y="168" font-size="16" fill="#0E1B3D">Actual weight</text><rect x="30" y="176" width="125" height="18" rx="5" fill="#5E6883" opacity="0.35"/><text x="163" y="191" font-size="16" font-weight="700" fill="#0E1B3D">80 kg</text><text x="30" y="218" font-size="16" fill="#0E1B3D">Volumetric weight (L×W×H / 6000)</text><rect x="30" y="226" width="250" height="18" rx="5" fill="#2F6BE8" opacity="1"/><text x="288" y="241" font-size="16" font-weight="700" fill="#0E1B3D">160 kg</text><text x="30" y="270" font-size="19" font-weight="700" fill="#1F8A4C">You pay for: 160 kg</text><rect x="14" y="300" width="372" height="214" rx="14" fill="#fff"/><text x="30" y="332" font-size="20" font-weight="700" fill="#0E1B3D">Shipment 2: metal parts</text><text x="30" y="356" font-size="16" fill="#5E6883">5 cartons 40×30×30 cm, 20 kg each</text><text x="30" y="394" font-size="16" fill="#0E1B3D">Actual weight</text><rect x="30" y="402" width="156" height="18" rx="5" fill="#5E6883" opacity="1"/><text x="194" y="417" font-size="16" font-weight="700" fill="#0E1B3D">100 kg</text><text x="30" y="444" font-size="16" fill="#0E1B3D">Volumetric weight (L×W×H / 6000)</text><rect x="30" y="452" width="47" height="18" rx="5" fill="#2F6BE8" opacity="0.35"/><text x="85" y="467" font-size="16" font-weight="700" fill="#0E1B3D">30 kg</text><text x="30" y="496" font-size="19" font-weight="700" fill="#1F8A4C">You pay for: 100 kg</text><text x="24" y="544" font-size="15" fill="#5E6883">Divisor 6000 is the IATA standard (per Maersk).</text><text x="24" y="566" font-size="15" fill="#5E6883">Our calculation, sample cartons</text></svg>
