<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 542" width="400" height="542" role="img" font-family="-apple-system, system-ui, Segoe UI, Roboto, Helvetica, Arial, sans-serif"><title>How to narrow it down</title><rect width="400" height="542" rx="20" fill="#F3F5F8"/><text x="24" y="50" font-size="26" font-weight="700" fill="#0E1B3D">How to narrow it down</text><rect x="20" y="74" width="360" height="98" rx="12" fill="#fff" stroke="#DCE1E9" stroke-width="2"/><rect x="20" y="74" width="7" height="98" rx="3" fill="#2F6BE8"/><text x="42" y="102" font-size="18" fill="#5E6883">Urgent, or a few kg</text><text x="42" y="126" font-size="18" fill="#5E6883">of samples?</text><text x="42" y="156" font-size="20" font-weight="700" fill="#0E1B3D">→ air</text><rect x="20" y="184" width="360" height="74" rx="12" fill="#fff" stroke="#DCE1E9" stroke-width="2"/><rect x="20" y="184" width="7" height="74" rx="3" fill="#1F8A4C"/><text x="42" y="212" font-size="18" fill="#5E6883">Light but bulky cargo?</text><text x="42" y="242" font-size="20" font-weight="700" fill="#0E1B3D">→ compare road, rail and sea</text><rect x="20" y="270" width="360" height="98" rx="12" fill="#fff" stroke="#DCE1E9" stroke-width="2"/><rect x="20" y="270" width="7" height="98" rx="3" fill="#0E1B3D"/><text x="42" y="298" font-size="18" fill="#5E6883">Large volume,</text><text x="42" y="322" font-size="18" fill="#5E6883">no rush?</text><text x="42" y="352" font-size="20" font-weight="700" fill="#0E1B3D">→ sea or rail</text><rect x="20" y="380" width="360" height="98" rx="12" fill="#fff" stroke="#DCE1E9" stroke-width="2"/><rect x="20" y="380" width="7" height="98" rx="3" fill="#B8322F"/><text x="42" y="408" font-size="18" fill="#5E6883">Lithium batteries</text><text x="42" y="432" font-size="18" fill="#5E6883">in the product?</text><text x="42" y="462" font-size="20" font-weight="700" fill="#0E1B3D">→ check carriage rules first</text><text x="24" y="508" font-size="15" fill="#5E6883">Our conclusion: chargeable weight (Maersk, DHL),</text><text x="24" y="530" font-size="15" fill="#5E6883">cost (Forto), batteries (IATA)</text></svg>
