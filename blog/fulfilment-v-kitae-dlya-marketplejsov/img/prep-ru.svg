<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 556" width="400" height="556" role="img" font-family="-apple-system, system-ui, Segoe UI, Roboto, Helvetica, Arial, sans-serif"><title>Что сделать в Китае</title><rect width="400" height="556" rx="20" fill="#F3F5F8"/><text x="24" y="50" font-size="24" font-weight="700" fill="#0E1B3D">Что сделать в Китае</text><rect x="14" y="72" width="372" height="62" rx="14" fill="#fff"/><circle cx="42" cy="103" r="13" fill="#1F8A4C"/><path d="M35 103 l5 5 l9 -10" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="66" y="99" font-size="18" font-weight="700" fill="#0E1B3D">Пересчитать и проверить</text><text x="66" y="121" font-size="15" fill="#5E6883">количество и брак до отправки</text><rect x="14" y="144" width="372" height="62" rx="14" fill="#fff"/><circle cx="42" cy="175" r="13" fill="#1F8A4C"/><path d="M35 175 l5 5 l9 -10" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="66" y="171" font-size="18" font-weight="700" fill="#0E1B3D">Индивидуальная упаковка</text><text x="66" y="193" font-size="15" fill="#5E6883">под требования площадки</text><rect x="14" y="216" width="372" height="62" rx="14" fill="#fff"/><circle cx="42" cy="247" r="13" fill="#1F8A4C"/><path d="M35 247 l5 5 l9 -10" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="66" y="243" font-size="18" font-weight="700" fill="#0E1B3D">Этикетка со штрихкодом</text><text x="66" y="265" font-size="15" fill="#5E6883">как в карточке товара</text><rect x="14" y="288" width="372" height="62" rx="14" fill="#fff"/><circle cx="42" cy="319" r="13" fill="#1F8A4C"/><path d="M35 319 l5 5 l9 -10" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="66" y="315" font-size="18" font-weight="700" fill="#0E1B3D">Маркировка на русском</text><text x="66" y="337" font-size="15" fill="#5E6883">одежда и текстиль, не для детей</text><rect x="14" y="360" width="372" height="62" rx="14" fill="#fff"/><circle cx="42" cy="391" r="13" fill="#1F8A4C"/><path d="M35 391 l5 5 l9 -10" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="66" y="387" font-size="18" font-weight="700" fill="#0E1B3D">Коды «Честного знака»</text><text x="66" y="409" font-size="15" fill="#5E6883">если товар маркируется</text><rect x="14" y="432" width="372" height="62" rx="14" fill="#fff"/><circle cx="42" cy="463" r="13" fill="#1F8A4C"/><path d="M35 463 l5 5 l9 -10" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="66" y="459" font-size="18" font-weight="700" fill="#0E1B3D">Короба подписаны</text><text x="66" y="481" font-size="15" fill="#5E6883">артикул и количество</text><text x="24" y="522" font-size="15" fill="#5E6883">По материалам МоегоСклада, ТР ТС 017/2011</text><text x="24" y="544" font-size="15" fill="#5E6883">и базы знаний «Честного знака»</text></svg>
