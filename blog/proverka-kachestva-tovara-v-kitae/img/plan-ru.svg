<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 762" width="560" height="762" role="img" font-family="-apple-system, system-ui, Segoe UI, Roboto, Helvetica, Arial, sans-serif"><title>Как читать план выборки</title><rect width="560" height="762" rx="20" fill="#F3F5F8"/><text x="32" y="58" font-size="31" font-weight="700" fill="#0E1B3D">Как читать план выборки</text><text x="32" y="94" font-size="23" fill="#5E6883">нормальный контроль, одноступенчатый план</text><rect x="32" y="120" width="496" height="70" rx="14" fill="#fff" stroke="#DCE1E9" stroke-width="2"/><text x="52" y="164" font-size="24" fill="#5E6883">Размер партии</text><text x="508" y="165" font-size="28" font-weight="700" fill="#0E1B3D" text-anchor="end">2500 шт</text><path d="M270.0 196 L290.0 196 L280.0 208 Z" fill="#2F6BE8"/><rect x="32" y="216" width="496" height="70" rx="14" fill="#fff" stroke="#DCE1E9" stroke-width="2"/><text x="52" y="260" font-size="24" fill="#5E6883">Уровень контроля</text><text x="508" y="261" font-size="28" font-weight="700" fill="#0E1B3D" text-anchor="end">II</text><path d="M270.0 292 L290.0 292 L280.0 304 Z" fill="#2F6BE8"/><rect x="32" y="312" width="496" height="70" rx="14" fill="#fff" stroke="#DCE1E9" stroke-width="2"/><text x="52" y="356" font-size="24" fill="#5E6883">Код выборки</text><text x="508" y="357" font-size="28" font-weight="700" fill="#0E1B3D" text-anchor="end">K</text><path d="M270.0 388 L290.0 388 L280.0 400 Z" fill="#2F6BE8"/><rect x="32" y="408" width="496" height="70" rx="14" fill="#fff" stroke="#DCE1E9" stroke-width="2"/><text x="52" y="452" font-size="24" fill="#5E6883">Проверить случайно</text><text x="508" y="453" font-size="28" font-weight="700" fill="#0E1B3D" text-anchor="end">125 шт</text><path d="M270.0 484 L290.0 484 L280.0 496 Z" fill="#2F6BE8"/><rect x="32" y="504" width="496" height="70" rx="14" fill="#fff" stroke="#DCE1E9" stroke-width="2"/><text x="52" y="548" font-size="24" fill="#5E6883">AQL</text><text x="508" y="549" font-size="28" font-weight="700" fill="#0E1B3D" text-anchor="end">1,0</text><path d="M270.0 580 L290.0 580 L280.0 592 Z" fill="#2F6BE8"/><rect x="32.0" y="600" width="240.0" height="96" rx="14" fill="#1F8A4C"/><text x="152.0" y="640" font-size="25" font-weight="700" fill="#fff" text-anchor="middle">≤ 3 дефектных</text><text x="152.0" y="674" font-size="20" fill="#fff" text-anchor="middle">партию принимают</text><rect x="288.0" y="600" width="240.0" height="96" rx="14" fill="#B8322F"/><text x="408.0" y="640" font-size="25" font-weight="700" fill="#fff" text-anchor="middle">≥ 4 дефектных</text><text x="408.0" y="674" font-size="20" fill="#fff" text-anchor="middle">партию не принимают</text><text x="32" y="736" font-size="21" fill="#5E6883">Пример 27 из ГОСТ Р 50779.70-99</text></svg>
