<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 650" width="560" height="650" role="img" font-family="-apple-system, system-ui, Segoe UI, Roboto, Helvetica, Arial, sans-serif"><title>Четыре этапа проверки</title><rect width="560" height="650" rx="20" fill="#F3F5F8"/><text x="32" y="62" font-size="31" font-weight="700" fill="#0E1B3D">Четыре этапа проверки</text><line x1="58" y1="138" x2="58" y2="238" stroke="#DCE1E9" stroke-width="4"/><circle cx="58" cy="138" r="26" fill="#2F6BE8"/><text x="58" y="148" font-size="27" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="100" y="134" font-size="28" font-weight="700" fill="#0E1B3D">До производства</text><text x="100" y="170" font-size="24" fill="#5E6883">сырьё и комплектующие</text><line x1="58" y1="264" x2="58" y2="364" stroke="#DCE1E9" stroke-width="4"/><circle cx="58" cy="264" r="26" fill="#2F6BE8"/><text x="58" y="274" font-size="27" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="100" y="260" font-size="28" font-weight="700" fill="#0E1B3D">Во время производства</text><text x="100" y="296" font-size="24" fill="#5E6883">первые изделия с линии</text><line x1="58" y1="390" x2="58" y2="490" stroke="#DCE1E9" stroke-width="4"/><circle cx="58" cy="390" r="26" fill="#E08A00"/><text x="58" y="400" font-size="27" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="100" y="386" font-size="28" font-weight="700" fill="#0E1B3D">Перед отгрузкой</text><text x="100" y="422" font-size="24" fill="#5E6883">выборка из готовой партии</text><circle cx="58" cy="516" r="26" fill="#2F6BE8"/><text x="58" y="526" font-size="27" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="100" y="512" font-size="28" font-weight="700" fill="#0E1B3D">При погрузке</text><text x="100" y="548" font-size="24" fill="#5E6883">грузят тот же товар</text><text x="32" y="620" font-size="21" fill="#5E6883">По описанию этапов Intertek</text></svg>
