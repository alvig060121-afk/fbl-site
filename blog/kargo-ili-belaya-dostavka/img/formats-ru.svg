<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 694" width="400" height="694" role="img" font-family="-apple-system, system-ui, Segoe UI, Roboto, Helvetica, Arial, sans-serif"><title>Карго или белая</title><rect width="400" height="694" rx="20" fill="#F3F5F8"/><text x="24" y="50" font-size="26" font-weight="700" fill="#0E1B3D">Карго или белая</text><rect x="14" y="74" width="372" height="272" rx="14" fill="#fff"/><rect x="14" y="74" width="7" height="272" rx="3" fill="#2F6BE8"/><text x="34" y="110" font-size="22" font-weight="700" fill="#0E1B3D">Карго</text><text x="34" y="140" font-size="15" fill="#5E6883">Кто оформляет груз</text><text x="34" y="162" font-size="18" font-weight="700" fill="#0E1B3D">перевозчик</text><text x="34" y="194" font-size="15" fill="#5E6883">Таможенная декларация</text><text x="34" y="216" font-size="18" font-weight="700" fill="#0E1B3D">не на вас</text><text x="34" y="248" font-size="15" fill="#5E6883">Ваша работа с документами</text><text x="34" y="270" font-size="18" font-weight="700" fill="#0E1B3D">не нужна</text><text x="34" y="302" font-size="15" fill="#5E6883">Сроки у FBL Group</text><text x="34" y="324" font-size="18" font-weight="700" fill="#0E1B3D">одинаковые</text><rect x="14" y="358" width="372" height="272" rx="14" fill="#fff"/><rect x="14" y="358" width="7" height="272" rx="3" fill="#0E1B3D"/><text x="34" y="394" font-size="22" font-weight="700" fill="#0E1B3D">Белая доставка</text><text x="34" y="424" font-size="15" fill="#5E6883">Кто оформляет груз</text><text x="34" y="446" font-size="18" font-weight="700" fill="#0E1B3D">декларант: вы или импортёр</text><text x="34" y="478" font-size="15" fill="#5E6883">Таможенная декларация</text><text x="34" y="500" font-size="18" font-weight="700" fill="#0E1B3D">на декларанта</text><text x="34" y="532" font-size="15" fill="#5E6883">Ваша работа с документами</text><text x="34" y="554" font-size="18" font-weight="700" fill="#0E1B3D">договор, инвойс, сертификаты</text><text x="34" y="586" font-size="15" fill="#5E6883">Сроки у FBL Group</text><text x="34" y="608" font-size="18" font-weight="700" fill="#0E1B3D">одинаковые</text><text x="24" y="660" font-size="15" fill="#5E6883">FBL Group; Таможенный кодекс ЕАЭС,</text><text x="24" y="682" font-size="15" fill="#5E6883">ст. 83 и 46</text></svg>
