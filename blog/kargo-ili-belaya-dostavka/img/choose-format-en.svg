<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 392" width="400" height="392" role="img" font-family="-apple-system, system-ui, Segoe UI, Roboto, Helvetica, Arial, sans-serif"><title>How to choose a format</title><rect width="400" height="392" rx="20" fill="#F3F5F8"/><text x="24" y="50" font-size="26" font-weight="700" fill="#0E1B3D">How to choose a format</text><line x1="40" y1="114" x2="40" y2="162" stroke="#DCE1E9" stroke-width="3"/><circle cx="40" cy="100" r="14" fill="#0E1B3D"/><text x="40" y="105" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="66" y="102" font-size="19" font-weight="700" fill="#0E1B3D">Selling on a marketplace?</text><text x="66" y="124" font-size="15" fill="#5E6883">check if you need a certificate</text><line x1="40" y1="178" x2="40" y2="226" stroke="#DCE1E9" stroke-width="3"/><circle cx="40" cy="164" r="14" fill="#0E1B3D"/><text x="40" y="169" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="66" y="166" font-size="19" font-weight="700" fill="#0E1B3D">Entitled to a VAT deduction?</text><text x="66" y="188" font-size="15" fill="#5E6883">documents needed for it</text><line x1="40" y1="242" x2="40" y2="290" stroke="#DCE1E9" stroke-width="3"/><circle cx="40" cy="228" r="14" fill="#0E1B3D"/><text x="40" y="233" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="66" y="230" font-size="19" font-weight="700" fill="#0E1B3D">Do buyers need documents?</text><text x="66" y="252" font-size="15" fill="#5E6883">ask them in advance</text><circle cx="40" cy="292" r="14" fill="#2F6BE8"/><text x="40" y="297" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="66" y="294" font-size="19" font-weight="700" fill="#0E1B3D">No need for import papers?</text><text x="66" y="316" font-size="15" fill="#2F6BE8">cargo is simpler</text><text x="24" y="358" font-size="15" fill="#5E6883">Based on Russian Tax Code Art. 170, 172</text><text x="24" y="380" font-size="15" fill="#5E6883">and Kontur.Elba</text></svg>
